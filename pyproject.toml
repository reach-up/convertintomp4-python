[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convertintomp4"
version = "1.0.0"
description = "Official Python SDK for the ConvertIntoMP4 file conversion API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ConvertIntoMP4", email = "support@convertintomp4.com"},
]
keywords = ["convertintomp4", "file-conversion", "video", "audio", "image", "pdf", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://convertintomp4.com"
Documentation = "https://convertintomp4.com/api-docs"
Repository = "https://github.com/reach-up/convertintomp4-python"
Issues = "https://github.com/reach-up/convertintomp4-python/issues"

[tool.setuptools.packages.find]
include = ["convertintomp4*"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py38"
line-length = 100
